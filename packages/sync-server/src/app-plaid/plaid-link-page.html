<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plaid Link</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: #f5f5f5;
      }
      #status {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 13px;
        color: #888;
      }
      .step.ok {
        color: #2a6;
      }
      .step.fail {
        color: #c33;
        font-weight: 500;
      }
      .step::before {
        content: '○';
        font-size: 11px;
      }
      .step.ok::before {
        content: '✓';
        color: #2a6;
      }
      .step.fail::before {
        content: '✗';
        color: #c33;
      }
      #error-detail {
        margin-top: 12px;
        padding: 10px 14px;
        background: #fee;
        color: #c33;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">
      <div class="step" id="s-token">Reading link_token from URL</div>
      <div class="step" id="s-script">Loading Plaid SDK from CDN</div>
      <div class="step" id="s-sdk">window.Plaid available</div>
      <div class="step" id="s-create">Plaid.create() called</div>
      <div class="step" id="s-open">handler.open() called — Plaid UI launching</div>
      <div id="error-detail"></div>
    </div>

    <script>
      // Catch CSP violations early — if CDN is blocked by CSP this fires before onerror
      document.addEventListener('securitypolicyviolation', function (e) {
        var msg =
          'CSP violation: ' +
          e.violatedDirective +
          ' blocked ' +
          e.blockedURI +
          (e.disposition === 'enforce' ? ' (enforced)' : ' (report-only)');
        console.error('[Plaid Link Page] ' + msg);
        fail('s-script', msg);
      });

      // --- COOP workaround ---
      // The main app (Vite dev server) sets Cross-Origin-Opener-Policy: same-origin.
      // That makes window.opener === null inside this cross-origin popup, so we cannot
      // initiate postMessage to the main app from here. Instead, the main app sends a
      // 'plaid-init' message to us; we capture event.source (which is the main app
      // window, still accessible even when window.opener is null) and use it for all
      // subsequent postMessages back.
      var mainAppWindow = null;
      var mainAppOrigin = null;

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'plaid-init') {
          console.log('[Plaid Link Page] Received plaid-init from', e.origin, '— storing event.source');
          mainAppWindow = e.source;
          mainAppOrigin = e.origin;
          // Confirm the channel is open so main app stops sending init messages.
          e.source.postMessage({ type: 'plaid-popup-ready' }, e.origin);
          console.log('[Plaid Link Page] Sent plaid-popup-ready to main app');
        }
      });

      function sendToMainApp(msg) {
        // Use mainAppWindow (from event.source) when available; fall back to
        // window.opener for environments where COOP is not set.
        var target = mainAppWindow || window.opener;
        var origin = mainAppOrigin || appOrigin;
        console.log(
          '[Plaid Link Page] sendToMainApp type=' + msg.type +
          ' target=' + (target ? 'available' : 'NULL') +
          ' origin=' + origin
        );
        if (target) {
          target.postMessage(msg, origin);
          return true;
        }
        console.error('[Plaid Link Page] No target window — message NOT sent. ' +
          'window.opener=' + window.opener + ' mainAppWindow=' + mainAppWindow);
        return false;
      }
      // --- end COOP workaround ---

      function ok(id) {
        var el = document.getElementById(id);
        if (el) el.className = 'step ok';
      }
      function fail(id, detail) {
        var el = document.getElementById(id);
        if (el) el.className = 'step fail';
        if (detail) {
          var ed = document.getElementById('error-detail');
          ed.style.display = 'block';
          ed.textContent = detail;
        }
        console.error('[Plaid Link Page] FAIL at ' + id + ':', detail || '');
      }

      // Step 1: read link_token + app_origin from URL; persist both for Plaid OAuth reloads
      // (Plaid's OAuth redirect strips query params, so we save to sessionStorage)
      var params = new URLSearchParams(window.location.search);
      var linkToken = params.get('link_token');
      var appOrigin = params.get('app_origin');

      if (linkToken) {
        sessionStorage.setItem('plaid_link_token', linkToken);
      } else {
        linkToken = sessionStorage.getItem('plaid_link_token');
      }

      // app_origin is the main app window's origin (may differ from popup's origin in dev)
      if (appOrigin) {
        sessionStorage.setItem('plaid_app_origin', appOrigin);
      } else {
        appOrigin = sessionStorage.getItem('plaid_app_origin') || window.location.origin;
      }

      console.log('[Plaid Link Page] appOrigin:', appOrigin, 'window.opener:', window.opener);

      if (!linkToken) {
        fail('s-token', 'Missing link_token query parameter');
      } else {
        ok('s-token');
        console.log('[Plaid Link Page] link_token found (first 20 chars):', linkToken.substring(0, 20));

        // Step 2: load the Plaid SDK dynamically so we can detect load errors
        var script = document.createElement('script');
        script.src = '/plaid/link-sdk.js';

        script.onload = function () {
          ok('s-script');
          console.log('[Plaid Link Page] Plaid SDK script loaded');

          // Step 3: verify window.Plaid exists
          if (typeof window.Plaid === 'undefined') {
            fail('s-sdk', 'window.Plaid is undefined after script load');
            return;
          }
          ok('s-sdk');
          console.log('[Plaid Link Page] window.Plaid is available');

          // Step 4: create handler
          var handler;
          try {
            handler = window.Plaid.create({
              token: linkToken,
              onSuccess: function (publicToken, metadata) {
                console.log('[Plaid Link Page] onSuccess fired');
                console.log('[Plaid Link Page] publicToken present:', !!publicToken);
                var accountCount = metadata && metadata.accounts ? metadata.accounts.length : 0;
                console.log('[Plaid Link Page] metadata.accounts count:', accountCount);
                console.log('[Plaid Link Page] institution:', metadata && metadata.institution ? metadata.institution.name : '(none)');

                // Fast path: postMessage (works when COOP does not block cross-BCG messaging).
                // Send BEFORE the relay fetch so it arrives while popup is still open.
                var target = mainAppWindow || window.opener;
                console.log('[Plaid Link Page] sending plaid-link-success to main app, postMessage target available:', !!target);
                sendToMainApp({
                  type: 'plaid-link-success',
                  publicToken: publicToken,
                  metadata: metadata,
                });

                // Reliable path: server-side relay. The popup calls /popup-complete (same-origin,
                // session-exempt, authenticated by linkToken). The main app polls /popup-result.
                // window.close() is called AFTER the fetch resolves so the result is stored first.
                var institutionId = metadata && metadata.institution ? metadata.institution.institution_id : undefined;
                var institutionName = metadata && metadata.institution ? metadata.institution.name : undefined;
                console.log('[Plaid Link Page] sending /plaid/popup-complete for server-side relay');
                fetch('/plaid/popup-complete', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    linkToken: linkToken,
                    publicToken: publicToken,
                    institutionId: institutionId,
                    institutionName: institutionName,
                  }),
                })
                  .then(function (r) { return r.json(); })
                  .then(function (data) {
                    console.log('[Plaid Link Page] /plaid/popup-complete response status:', data.status);
                    // Small delay so in-flight postMessage can be delivered before close.
                    setTimeout(function () { window.close(); }, 200);
                  })
                  .catch(function (e) {
                    console.error('[Plaid Link Page] /plaid/popup-complete failed:', e.message);
                    setTimeout(function () { window.close(); }, 200);
                  });
              },
              onExit: function (err, metadata) {
                console.log('[Plaid Link Page] onExit called, err:', err);
                if (err) {
                  var errMsg =
                    (err.display_message || err.error_message || err.error_type) ||
                    JSON.stringify(err);
                  fail(
                    's-open',
                    'Plaid onExit error: ' + errMsg + '\n\nmetadata: ' + JSON.stringify(metadata, null, 2),
                  );
                  sendToMainApp({
                    type: 'plaid-link-error',
                    error: errMsg,
                    metadata: metadata,
                  });
                } else {
                  sendToMainApp({ type: 'plaid-link-exit', metadata: metadata });
                  window.close();
                }
              },
              onEvent: function (eventName, metadata) {
                console.log('[Plaid Link Page] onEvent:', eventName, metadata);
              },
            });
          } catch (e) {
            fail('s-create', 'Plaid.create() threw: ' + String(e));
            return;
          }
          ok('s-create');

          // Step 5: open
          try {
            handler.open();
          } catch (e) {
            fail('s-open', 'handler.open() threw: ' + String(e));
            return;
          }
          ok('s-open');
          console.log('[Plaid Link Page] handler.open() called');
        };

        script.onerror = function (e) {
          var hint =
            'Script failed to load from /plaid/link-sdk.js (same-origin Plaid SDK proxy)\n\n' +
            'Possible causes:\n' +
            '1. Sync server could not fetch Plaid CDN — check server logs for 502 error\n' +
            '2. CSP: script-src does not allow \'self\'\n' +
            '3. Route /plaid/link-sdk.js not exempted from COEP in app.ts\n\n' +
            'Check browser console (F12) and Network tab: inspect /plaid/link-sdk.js status.';
          fail('s-script', hint);
          console.error('[Plaid Link Page] script onerror event:', e);
        };

        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
